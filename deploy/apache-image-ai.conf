# Kardlyz image AI service (Background Remover) behind api.kardlyz.com.
#
# NOT a vhost of its own: paste the lines below INSIDE the existing
# <VirtualHost *:443> block for api.kardlyz.com (the one holding
# `ProxyPass / http://127.0.0.1:4000/`), e.g.
#   /etc/apache2/sites-available/api.kardlyz.com.conf
# Find it with:  grep -l "ProxyPass / http://127.0.0.1:4000/" /etc/apache2/sites-enabled/*
#
# ORDER MATTERS: put them ABOVE `ProxyPass / http://127.0.0.1:4000/`.
# Apache uses the first ProxyPass that matches; below the catch-all, every
# /image-ai/ request would go to the Kardlyz API on :4000 and 404 there.
#
# Then, before reloading (a syntax error in ANY vhost takes down EVERY site on the box):
#   sudo apache2ctl configtest          # must print "Syntax OK"
#   sudo systemctl reload apache2
#
# Public base URL (the /image-ai/ prefix is stripped before it reaches the service):
#   https://api.kardlyz.com/image-ai/api/background-remover
# Modules: proxy and proxy_http, already enabled for the API.

    # --- image AI: kardlyz-image-ai (PM2) on 127.0.0.1:8110 ---------------
    # 320 s: a cut-out takes ~60-75 s on CPU, plus ~15 s for a cold model load,
    # plus up to 60 s waiting for the single inference lock on /export-hd.
    ProxyPass        /image-ai/ http://127.0.0.1:8110/ timeout=320 retry=0
    ProxyPassReverse /image-ai/ http://127.0.0.1:8110/

    <Location /image-ai/>
        # 26 MB for this path only; the vhost's 16 MB cap still covers the API.
        # The page refuses files over 25 MB before sending; multipart adds a little.
        # The service itself also caps /remove at 26 MB and /export-hd at 20 MB.
        LimitRequestBody 27262976
    </Location>
